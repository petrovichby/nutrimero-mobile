font:
  family: 'Plus Jakarta Sans'
  # The stack the corpus has emitted on all 62 screens since normalization,
  # unanimous and, until now, unruled.
  stack: "'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
  # Every weight the type scale calls for. 500 exists only for `data-mono`.
  weights: [400, 500, 600, 700]
  # A surface requests the weights IT renders, not the full set.
  delivery: 'webfont, subset to the weights the surface renders'
  hosting: 'self-hosted'
typography:
  headline-lg:
    fontFamily: Plus Jakarta Sans
    fontSize: 24px
    fontWeight: '700'
    lineHeight: 32px
    letterSpacing: -0.01em
  headline-md:
    fontFamily: Plus Jakarta Sans
    fontSize: 20px
    fontWeight: '600'
    lineHeight: 28px
  headline-sm:
    fontFamily: Plus Jakarta Sans
    fontSize: 16px
    fontWeight: '600'
    lineHeight: 24px
  body-lg:
    fontFamily: Plus Jakarta Sans
    fontSize: 15px
    fontWeight: '400'
    lineHeight: 22px
  body-md:
    fontFamily: Plus Jakarta Sans
    fontSize: 14px
    fontWeight: '400'
    lineHeight: 20px
  body-sm:
    fontFamily: Plus Jakarta Sans
    fontSize: 13px
    fontWeight: '400'
    lineHeight: 18px
  label-md:
    fontFamily: Plus Jakarta Sans
    fontSize: 12px
    fontWeight: '600'
    lineHeight: 16px
    letterSpacing: 0.02em
  label-sm:
    fontFamily: Plus Jakarta Sans
    fontSize: 11px
    fontWeight: '700'
    lineHeight: 14px
  data-mono:
    fontFamily: Plus Jakarta Sans
    fontSize: 13px
    fontWeight: '500'
    lineHeight: 18px
    letterSpacing: -0.01em
  identifier:
    fontFamily: Plus Jakarta Sans
    fontSize: 13px
    fontWeight: '600'
    lineHeight: 18px
    letterSpacing: 0.04em
  mode-badge:
    fontFamily: Plus Jakarta Sans
    fontSize: 10px
    fontWeight: '700'
    lineHeight: 12px
    letterSpacing: 0.04em
  hint:
    fontFamily: Plus Jakarta Sans
    fontSize: 11px
    fontWeight: '400'
    lineHeight: 15px
    letterSpacing: 0
rounded:
  xs: 0.125rem
  sm: 0.25rem
  md: 0.375rem
  lg: 0.5rem
  xl: 0.75rem
  full: 9999px
spacing:
  unit: 4px
  compact-gutter: 8px
  standard-padding: 12px
  container-margin: 24px
  table-row-height: 32px
zIndex:
  sticky: 10
  overlay: 20
  popover: 30
shadow:
  overlay: '0 4px 12px rgb(0 0 0 / 0.16)'
filter:
  brand-edge: 'drop-shadow(0.3px 0 0 light-dark(transparent, var(--on-surface-variant))) drop-shadow(-0.3px 0 0 light-dark(transparent, var(--on-surface-variant))) drop-shadow(0 0.3px 0 light-dark(transparent, var(--on-surface-variant))) drop-shadow(0 -0.3px 0 light-dark(transparent, var(--on-surface-variant)))'
motion:
  reduced-fade: 150ms
  ease-settle: 'cubic-bezier(0.16, 1, 0.3, 1)'
  feedback: 120ms      # press, focus ring, hover colour — acknowledge, never perform
  state: 240ms         # a state making its case: a notice, a banner, a jumped-to record
  arrive: 480ms        # the one authored entrance per document load
  stagger-step: 80ms   # between siblings arriving as a set
  stagger-cap: 360ms   # no sibling waits longer, however long the list
  travel-in: 12px      # an element arriving from below
  travel-down: 8px     # an element settling from above
  press-depth: 1px     # the only transform a control makes under the pointer
