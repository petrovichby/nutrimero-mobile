<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nutrimero Home Baker — Splash (light, en)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Pacifico&family=Stardos+Stencil:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .phone { background: #f7f4ec; }

  /* masthead band bleeds behind the status bar */
  .band {
    background: var(--navy);
    color: #f7f4ec;
    flex: none;
    min-height: 286px;  /* ~34% of the frame, per the cover contract */
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 50px 24px 26px;  /* top = status bar height */
    position: relative;
  }
  .band .statusbar-overlay {
    position: absolute; top: 0; left: 0; right: 0;
    height: 50px;
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 26px 6px;
    font-size: 15px; font-weight: 600;
    color: #f7f4ec;
  }
  .wordmark {
    margin-top: 10px;
    font-size: 14px; font-weight: 800; line-height: 18px;
    letter-spacing: 0.38em; text-indent: 0.38em; /* balance tracking */
    color: rgba(247, 244, 236, 0.85);
  }
  .band .script {
    font-family: "Pacifico", cursive;
    font-size: 56px; line-height: 86px;
    color: #f7f4ec;
    margin-top: 2px;
  }
  .band .fleuron { margin-top: 8px; color: rgba(247, 244, 236, 0.55); }

  .field {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 28px 24px 12px;
  }
  .cover-plate {
    width: 296px; height: 222px;
    background: var(--canvas);
    position: relative;
    /* printed-plate double frame */
    border: 1px solid rgba(27, 31, 88, 0.5);
    outline: 1px solid rgba(27, 31, 88, 0.5);
    outline-offset: 4px;
    overflow: hidden;
  }
  .cover-plate img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .plate-caption {
    margin-top: 14px;
    font-size: 11px; font-weight: 700; line-height: 14px;
    letter-spacing: 0.18em; text-indent: 0.18em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .tagline {
    margin-top: 20px;
    font-size: 13px; font-weight: 700; line-height: 18px;
    letter-spacing: 0.22em; text-indent: 0.22em;
    text-transform: uppercase;
    color: var(--heading);
  }

  .lime-rule { flex: none; height: 2px; background: var(--lime); }

  .foot {
    flex: none;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 26px 24px 10px;
  }
  .dots { display: flex; gap: 10px; }
  .dots span {
    width: 8px; height: 8px; border-radius: 999px;
    border: 1.5px solid var(--lime);
    background: transparent;
  }
  .dots span.on { background: var(--lime); }
  .colophon {
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    color: var(--ink-2);
  }
</style>
</head>
<body>

<div class="phone" data-scheme="light">
  <div class="screen" style="overflow:hidden">
    <div class="band">
      <div class="statusbar-overlay">
        <span>9:41</span>
        <svg width="70" height="13" viewBox="0 0 70 13" fill="currentColor" aria-hidden="true">
          <rect x="0" y="8" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="7" rx="1"/><rect x="10" y="3.5" width="3" height="9.5" rx="1"/><rect x="15" y="1" width="3" height="12" rx="1"/>
          <path d="M28.5 5.2a8.6 8.6 0 0 1 11 0l-1.6 1.9a6.1 6.1 0 0 0-7.8 0l-1.6-1.9Zm2.7 3.2a4.4 4.4 0 0 1 5.6 0L34 12l-2.8-3.6Z"/>
          <rect x="46" y="1.5" width="20" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
          <rect x="48" y="3.5" width="14" height="6" rx="1.6"/>
          <path d="M67.5 5v3a2.4 2.4 0 0 0 0-3Z" opacity="0.5"/>
        </svg>
      </div>
      <div class="wordmark">NUTRIMERO</div>
      <div class="script">Home Baker</div>
      <div class="fleuron" aria-hidden="true"><span class="diamond"></span></div>
    </div>

    <div class="field">
      <div class="cover-plate">
        <img src="assets/ill-rustic-sourdough.png" alt="Engraved illustration of a rustic sourdough loaf on a striped cloth">
        <span class="chip chip-provenance-onimage" style="position:absolute; right:8px; bottom:8px;">AI Illustration</span>
      </div>
      <p class="plate-caption">Plate I · Rustic sourdough</p>
      <p class="tagline">The home baker’s companion</p>
    </div>

    <div class="lime-rule" aria-hidden="true"></div>

    <div class="foot">
      <div class="dots" role="progressbar" aria-label="Loading">
        <span></span><span class="on"></span><span></span>
      </div>
      <div class="colophon">nutrimero.org</div>
    </div>
  </div>
  <div class="home-indicator"></div>
</div>

</body>
</html>
