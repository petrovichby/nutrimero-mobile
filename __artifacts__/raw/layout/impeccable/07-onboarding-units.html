<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nutrimero Home Baker — Onboarding 1: Units (light, en)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .ob-top {
    flex: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 2px 8px 0 16px;
    min-height: 44px;
  }
  .ob-dots { display: flex; gap: 6px; }
  .ob-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--surface-2); }
  .ob-dot.on { background: var(--navy); width: 20px; }
  .ob-skip {
    border: none; background: none; cursor: pointer;
    min-height: 44px; padding: 0 12px;
    font-family: inherit; font-size: 15px; font-weight: 600; color: var(--ink-2);
  }
  .ob-body { flex: 1; min-height: 0; padding: 18px 20px 0; display: flex; flex-direction: column; }
  .ob-body h1 { margin-bottom: 6px; }
  .ob-body > p { color: var(--ink-2); margin-bottom: 22px; }

  .unit-card {
    border: 1.5px solid var(--outline);
    border-radius: var(--r-xl);
    background: var(--surface);
    padding: 16px;
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 14px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    width: 100%;
  }
  .unit-card[aria-checked="true"] { border-color: var(--navy); background: var(--surface-1); }
  .unit-sample {
    width: 64px; height: 64px; flex: none;
    background: var(--canvas);
    border-radius: var(--r-lg);
    display: grid; place-items: center;
    font-size: 17px; font-weight: 700; color: var(--heading);
    font-variant-numeric: tabular-nums;
  }
  .unit-t h2 { font-size: 17px; font-weight: 700; color: var(--heading); }
  .unit-t p { font-size: 13px; line-height: 18px; color: var(--ink-2); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .unit-check { margin-left: auto; width: 26px; height: 26px; border-radius: 999px; display: grid; place-items: center; flex: none; }
  .unit-card[aria-checked="true"] .unit-check { background: var(--lime); color: var(--on-lime); }
  .unit-check svg { width: 15px; height: 15px; }

  .convert {
    margin-top: 18px;
    background: var(--canvas);
    border-radius: var(--r-xl);
    padding: 14px 16px;
  }
  .convert .label-md { color: #5a5d72; margin-bottom: 8px; }
  .conv-row {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 6px 0;
    font-size: 15px; font-weight: 500; color: #5a5d72;
    font-variant-numeric: tabular-nums;
  }
  .conv-row b { font-weight: 700; color: #1b1f58; }
  .ob-note { margin-top: 14px; padding-bottom: 12px; font-size: 12.5px; color: var(--ink-2); }
  .dock { flex: none; padding: 10px 16px 8px; background: var(--surface); }
  .dock .btn-primary { width: 100%; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M9.5 16.2 5.8 12.5l-1.8 1.8 5.5 5.5L20 9.3l-1.8-1.8-8.7 8.7Z"/></symbol>
</svg>

<div class="phone" data-scheme="light">
  <div class="statusbar">
    <span>9:41</span>
    <svg width="70" height="13" viewBox="0 0 70 13" fill="currentColor" aria-hidden="true">
      <rect x="0" y="8" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="7" rx="1"/><rect x="10" y="3.5" width="3" height="9.5" rx="1"/><rect x="15" y="1" width="3" height="12" rx="1"/>
      <path d="M28.5 5.2a8.6 8.6 0 0 1 11 0l-1.6 1.9a6.1 6.1 0 0 0-7.8 0l-1.6-1.9Zm2.7 3.2a4.4 4.4 0 0 1 5.6 0L34 12l-2.8-3.6Z"/>
      <rect x="46" y="1.5" width="20" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
      <rect x="48" y="3.5" width="14" height="6" rx="1.6"/>
      <path d="M67.5 5v3a2.4 2.4 0 0 0 0-3Z" opacity="0.5"/>
    </svg>
  </div>

  <div class="screen">
    <div class="ob-top">
      <div class="ob-dots" aria-label="Step 1 of 3"><span class="ob-dot on"></span><span class="ob-dot"></span><span class="ob-dot"></span></div>
      <button class="ob-skip">Skip</button>
    </div>

    <div class="ob-body">
      <h1 class="headline-lg">How do you measure?</h1>
      <p class="body-md">Every recipe converts instantly — you can change this anytime.</p>

      <div role="radiogroup" aria-label="Units">
        <button class="unit-card" role="radio" aria-checked="true">
          <span class="unit-sample data">420 g</span>
          <span class="unit-t"><h2>Metric</h2><p>grams · millilitres · °C</p></span>
          <span class="unit-check"><svg fill="currentColor"><use href="#i-check"/></svg></span>
        </button>
        <button class="unit-card" role="radio" aria-checked="false">
          <span class="unit-sample data">3¼ cups</span>
          <span class="unit-t"><h2>Imperial</h2><p>cups · ounces · °F</p></span>
          <span class="unit-check"></span>
        </button>
      </div>

      <div class="convert" aria-label="How your recipes will read">
        <p class="label-md">HOW YOUR RECIPES WILL READ</p>
        <div class="conv-row"><span>1 cup flour</span><b class="data">120 g</b></div>
        <div class="conv-row"><span>1 stick butter</span><b class="data">113 g</b></div>
        <div class="conv-row"><span>350 °F</span><b class="data">175 °C</b></div>
      </div>

      <p class="ob-note">Bakers’ tip: weighing in grams is the single biggest accuracy upgrade — our recipes are written metric-first.</p>
    </div>

    <div class="dock">
      <button class="btn-primary">Continue</button>
    </div>
  </div>

  <div class="home-indicator"></div>
</div>

</body>
</html>
