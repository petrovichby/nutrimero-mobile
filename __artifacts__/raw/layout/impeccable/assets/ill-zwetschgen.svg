<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Illustration of a plum sheet cake with rows of plum wedges">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.478  0 0 0 0 0.208  0 0 0 0 0.125  0.4 0.4 0.4 0 -0.62"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#f7f4ec"/>

  <!-- shadow + parchment -->
  <ellipse cx="200" cy="248" rx="132" ry="12" fill="#7a3520" opacity="0.10"/>
  <rect x="88" y="70" width="224" height="170" rx="6" fill="#efe6d2" transform="rotate(-2 200 155)"/>
  <rect x="88" y="70" width="224" height="170" rx="6" fill="none" stroke="#d8ccae" stroke-width="2" transform="rotate(-2 200 155)"/>

  <!-- cake slab -->
  <rect x="112" y="92" width="176" height="132" rx="10" fill="#e2b874" transform="rotate(-2 200 158)"/>
  <rect x="112" y="92" width="176" height="132" rx="10" fill="none" stroke="#7a3520" stroke-width="2" opacity="0.4" transform="rotate(-2 200 158)"/>

  <!-- plum wedges, 3 x 3 -->
  <g transform="rotate(-2 200 158)">
    <g fill="#4a4478">
      <path d="M132 108 q18 -10 36 0 q-8 18 -36 16 q-4 -8 0 -16z"/>
      <path d="M182 106 q18 -10 36 0 q-8 18 -36 16 q-4 -8 0 -16z"/>
      <path d="M232 108 q18 -10 36 0 q-8 18 -36 16 q-4 -8 0 -16z"/>
      <path d="M132 150 q18 -10 36 0 q-8 18 -36 16 q-4 -8 0 -16z"/>
      <path d="M182 148 q18 -10 36 0 q-8 18 -36 16 q-4 -8 0 -16z"/>
      <path d="M232 150 q18 -10 36 0 q-8 18 -36 16 q-4 -8 0 -16z"/>
      <path d="M132 192 q18 -10 36 0 q-8 18 -36 16 q-4 -8 0 -16z"/>
      <path d="M182 190 q18 -10 36 0 q-8 18 -36 16 q-4 -8 0 -16z"/>
      <path d="M232 192 q18 -10 36 0 q-8 18 -36 16 q-4 -8 0 -16z"/>
    </g>
    <g fill="none" stroke="#6f68a8" stroke-width="3" stroke-linecap="round">
      <path d="M140 112 q12 -6 22 -1"/>
      <path d="M190 110 q12 -6 22 -1"/>
      <path d="M240 112 q12 -6 22 -1"/>
      <path d="M140 154 q12 -6 22 -1"/>
      <path d="M190 152 q12 -6 22 -1"/>
      <path d="M240 154 q12 -6 22 -1"/>
      <path d="M140 196 q12 -6 22 -1"/>
      <path d="M190 194 q12 -6 22 -1"/>
      <path d="M240 196 q12 -6 22 -1"/>
    </g>
    <!-- streusel crumbs -->
    <g fill="#d9973f">
      <circle cx="172" cy="132" r="3.4"/>
      <circle cx="224" cy="136" r="3"/>
      <circle cx="150" cy="176" r="3.2"/>
      <circle cx="262" cy="176" r="3.4"/>
      <circle cx="206" cy="176" r="2.8"/>
      <circle cx="172" cy="216" r="3"/>
      <circle cx="238" cy="214" r="3.2"/>
    </g>
    <!-- lime leaf detail -->
    <path d="M212 122 C218 114 228 111 236 113 C232 121 224 126 216 126 Z" fill="#dfa621"/>
  </g>

  <rect width="400" height="300" filter="url(#grain)" opacity="0.35"/>
</svg>
