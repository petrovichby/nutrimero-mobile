<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Illustration of three Linzer cookies with jam centers on a plate">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.106  0 0 0 0 0.122  0 0 0 0 0.345  0.4 0.4 0.4 0 -0.62"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#f7f4ec"/>

  <!-- shadow + plate -->
  <ellipse cx="200" cy="252" rx="130" ry="12" fill="#1b1f58" opacity="0.10"/>
  <circle cx="200" cy="164" r="116" fill="#f0e8d4"/>
  <circle cx="200" cy="164" r="116" fill="none" stroke="#1b1f58" stroke-width="2.5" opacity="0.55"/>
  <circle cx="200" cy="164" r="98" fill="none" stroke="#d8ccae" stroke-width="2"/>

  <!-- back cookies -->
  <g>
    <circle cx="156" cy="128" r="47" fill="#ecc98e"/>
    <circle cx="156" cy="128" r="47" fill="none" stroke="#c9995a" stroke-width="2.5"/>
    <circle cx="156" cy="128" r="19" fill="#b8422c"/>
    <path d="M146 120 Q152 114 160 116" fill="none" stroke="#d86a4a" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g>
    <circle cx="248" cy="146" r="47" fill="#e6bf7e"/>
    <circle cx="248" cy="146" r="47" fill="none" stroke="#c9995a" stroke-width="2.5"/>
    <circle cx="248" cy="146" r="19" fill="#b8422c"/>
    <path d="M238 138 Q244 132 252 134" fill="none" stroke="#d86a4a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- front cookie -->
  <g>
    <circle cx="192" cy="204" r="50" fill="#ecc98e"/>
    <circle cx="192" cy="204" r="50" fill="none" stroke="#c9995a" stroke-width="2.5"/>
    <circle cx="192" cy="204" r="20" fill="#b8422c"/>
    <path d="M181 195 Q188 189 196 191" fill="none" stroke="#d86a4a" stroke-width="4" stroke-linecap="round"/>
    <!-- lime leaf on the jam -->
    <path d="M204 190 C210 182 220 179 228 181 C224 189 216 194 208 194 Z" fill="#b9bf05"/>
  </g>

  <!-- powdered sugar -->
  <circle cx="132" cy="106" r="2.2" fill="#ffffff" opacity="0.9"/>
  <circle cx="172" cy="98" r="1.8" fill="#ffffff" opacity="0.9"/>
  <circle cx="150" cy="150" r="1.8" fill="#ffffff" opacity="0.8"/>
  <circle cx="268" cy="120" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="236" cy="172" r="1.8" fill="#ffffff" opacity="0.8"/>
  <circle cx="170" cy="226" r="2.2" fill="#ffffff" opacity="0.9"/>
  <circle cx="214" cy="238" r="1.8" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="160" cy="112" rx="9" ry="4" fill="#ffffff" opacity="0.5"/>
  <ellipse cx="206" cy="220" rx="10" ry="4" fill="#ffffff" opacity="0.5"/>

  <rect width="400" height="300" filter="url(#grain)" opacity="0.35"/>
</svg>
