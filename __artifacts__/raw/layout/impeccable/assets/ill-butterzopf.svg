<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Illustration of a braided butter loaf on a wooden board">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.478  0 0 0 0 0.208  0 0 0 0 0.125  0.4 0.4 0.4 0 -0.62"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#f7f4ec"/>

  <!-- shadow + board -->
  <ellipse cx="200" cy="232" rx="140" ry="13" fill="#7a3520" opacity="0.10"/>
  <rect x="56" y="198" width="288" height="30" rx="15" fill="#e3d5bc"/>
  <path d="M70 213 H330" stroke="#cbb894" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="56" y="198" width="288" height="30" rx="15" fill="none" stroke="#7a3520" stroke-width="1.8" opacity="0.3"/>

  <!-- braid: end + four lobes + end -->
  <ellipse cx="100" cy="184" rx="26" ry="22" fill="#c9812f" transform="rotate(-14 100 184)"/>
  <ellipse cx="146" cy="172" rx="34" ry="29" fill="#d9973f" transform="rotate(16 146 172)"/>
  <ellipse cx="200" cy="164" rx="36" ry="31" fill="#c9812f" transform="rotate(-16 200 164)"/>
  <ellipse cx="254" cy="172" rx="34" ry="29" fill="#d9973f" transform="rotate(16 254 172)"/>
  <ellipse cx="300" cy="184" rx="26" ry="22" fill="#c9812f" transform="rotate(14 300 184)"/>

  <!-- crease lines between lobes -->
  <path d="M122 168 Q118 184 124 200" fill="none" stroke="#8a4a26" stroke-width="3" stroke-linecap="round"/>
  <path d="M174 156 Q170 172 176 194" fill="none" stroke="#8a4a26" stroke-width="3" stroke-linecap="round"/>
  <path d="M228 156 Q224 172 230 194" fill="none" stroke="#8a4a26" stroke-width="3" stroke-linecap="round"/>
  <path d="M278 168 Q274 184 280 200" fill="none" stroke="#8a4a26" stroke-width="3" stroke-linecap="round"/>

  <!-- egg-wash shine -->
  <path d="M134 152 Q146 146 158 150" fill="none" stroke="#f0c27f" stroke-width="6" stroke-linecap="round"/>
  <path d="M188 142 Q200 136 212 140" fill="none" stroke="#f0c27f" stroke-width="6" stroke-linecap="round"/>
  <path d="M242 152 Q254 146 266 150" fill="none" stroke="#f0c27f" stroke-width="6" stroke-linecap="round"/>

  <!-- navy base accent -->
  <path d="M92 204 Q200 222 308 204" fill="none" stroke="#7a3520" stroke-width="2" opacity="0.35"/>

  <!-- lime leaf detail -->
  <path d="M322 206 C330 196 342 192 352 194 C348 204 338 210 328 210 Z" fill="#dfa621"/>
  <path d="M326 207 C334 200 342 196 348 196" fill="none" stroke="#a97e14" stroke-width="1.6" stroke-linecap="round"/>

  <rect width="400" height="300" filter="url(#grain)" opacity="0.35"/>
</svg>
